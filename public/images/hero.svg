<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#8B5CF6"/>
  <!-- Simple running shoe icon -->
  <g transform="translate(600,200) scale(0.15)">
    <!-- Shoe sole -->
    <path d="M0,0 L10,0 L10,2 L8,2 L8,4 L2,4 L2,2 L0,2 Z" fill="#FFFFFF"/>
    -- Shoe upper
    <path d="M2,2 L2,-8 L4,-8 L4,-6 L6,-6 L6,-8 L8,-8 L8,-2 L10,-2 L10,0 L8,0 L8,1 L6,1 L6,3 L4,3 L4,1 L2,1 L2,2 Z" fill="#FFFFFF"/>
    -- Lace holes
    <circle cx="3" cy="-5" r="0.5" fill="#8B5CF6"/>
    <circle cx="5" cy="-5" r="0.5" fill="#8B5CF6"/>
    <circle cx="7" cy="-5" r="0.5" fill="#8B5CF6"/>
  </g>
  <!-- Optional: add some motion lines -->
  <g transform="translate(400,100)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="20" x2="20" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  </g>
  <g transform="translate(800,300)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="20" x2="20" y2="20" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  </g>
</svg>