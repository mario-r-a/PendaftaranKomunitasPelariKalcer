<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#8B5CF6"/>
  <!-- Runner silhouette -->
  <g transform="translate(600,250) scale(4)">
    <!-- Ground line -->
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7"/>
    <!-- Head -->
    <circle cx="0" cy="-80" r="10" fill="#FFFFFF"/>
    <!-- Body -->
    <line x1="0" y1="-70" x2="0" y2="10" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Right arm (forward) -->
    <line x1="0" y1="-50" x2="15" y2="-20" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Left arm (back) -->
    <line x1="0" y1="-50" x2="-15" y2="-30" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Right leg (back) -->
    <line x1="0" y1="10" x2="10" y2="30" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Left leg (forward) -->
    <line x1="0" y1="10" x2="-20" y2="40" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Optional: simple track lines -->
  <g transform="translate(0,350)">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
    <line x1="0" y1="10" x2="1200" y2="10" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
    <line x1="0" y1="20" x2="1200" y2="20" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
  </g>
</svg>