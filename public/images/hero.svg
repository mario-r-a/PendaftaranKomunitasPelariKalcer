<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(180,83,9,0.2)"/>
    </filter>
    <filter id="glowSun">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="trackShadow">
      <feDropShadow dx="0" dy="-2" stdDeviation="4" flood-color="rgba(180,83,9,0.15)"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="480" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <g opacity="0.7">
    <!-- Cloud 1 -->
    <g transform="translate(80, 60)">
      <ellipse cx="50" cy="20" rx="50" ry="20" fill="white"/>
      <ellipse cx="30" cy="22" rx="32" ry="16" fill="white"/>
      <ellipse cx="75" cy="22" rx="30" ry="15" fill="white"/>
      <ellipse cx="50" cy="28" rx="50" ry="12" fill="white"/>
    </g>
    <!-- Cloud 2 -->
    <g transform="translate(900, 40)">
      <ellipse cx="45" cy="18" rx="45" ry="18" fill="white"/>
      <ellipse cx="25" cy="20" rx="28" ry="14" fill="white"/>
      <ellipse cx="68" cy="20" rx="25" ry="13" fill="white"/>
      <ellipse cx="45" cy="26" rx="45" ry="10" fill="white"/>
    </g>
    <!-- Cloud 3 -->
    <g transform="translate(450, 30)">
      <ellipse cx="35" cy="15" rx="35" ry="15" fill="white" opacity="0.8"/>
      <ellipse cx="55" cy="17" rx="28" ry="12" fill="white" opacity="0.8"/>
      <ellipse cx="35" cy="22" rx="38" ry="9" fill="white" opacity="0.8"/>
    </g>
  </g>

  <!-- Sun -->
  <g filter="url(#glowSun)">
    <circle cx="980" cy="90" r="58" fill="url(#sunGrad)" opacity="0.9"/>
    <!-- Sun rays -->
    <g stroke="#fef08a" stroke-linecap="round" opacity="0.7">
      <line x1="980" y1="12" x2="980" y2="1"   stroke-width="4"/>
      <line x1="980" y1="168" x2="980" y2="180" stroke-width="4"/>
      <line x1="902" y1="90" x2="890" y2="90"   stroke-width="4"/>
      <line x1="1058" y1="90" x2="1070" y2="90" stroke-width="4"/>
      <line x1="925" y1="35" x2="916" y2="26"   stroke-width="3"/>
      <line x1="1035" y1="145" x2="1044" y2="154" stroke-width="3"/>
      <line x1="1035" y1="35" x2="1044" y2="26" stroke-width="3"/>
      <line x1="925" y1="145" x2="916" y2="154" stroke-width="3"/>
    </g>
  </g>

  <!-- Rolling hills background -->
  <g>
    <path d="M0,300 Q150,220 300,270 Q450,320 600,250 Q750,180 900,250 Q1050,320 1200,260 L1200,400 L0,400 Z"
          fill="url(#hillGrad2)" opacity="0.5"/>
    <path d="M0,320 Q200,260 400,290 Q600,320 800,270 Q1000,220 1200,280 L1200,400 L0,400 Z"
          fill="url(#hillGrad1)" opacity="0.6"/>
  </g>

  <!-- Track / Ground -->
  <rect x="0" y="390" width="1200" height="90" fill="url(#groundGrad)" filter="url(#trackShadow)"/>
  <!-- Track surface -->
  <rect x="0" y="390" width="1200" height="6" fill="#f59e0b" opacity="0.8"/>
  <!-- Track lane lines -->
  <line x1="0" y1="415" x2="1200" y2="415" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="440" x2="1200" y2="440" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Dashed center marking -->
  <line x1="0" y1="415" x2="1200" y2="415" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="35,25" opacity="0.8"/>
  <!-- Track shadow -->
  <rect x="0" y="390" width="1200" height="15" fill="rgba(0,0,0,0.06)"/>

  <!-- Trees (decorative) -->
  <g opacity="0.8">
    <!-- Tree 1 -->
    <rect x="95" y="330" width="8" height="55" fill="#92400e" rx="3"/>
    <ellipse cx="99" cy="310" rx="28" ry="32" fill="#16a34a"/>
    <ellipse cx="99" cy="318" rx="22" ry="24" fill="#22c55e"/>
    <!-- Tree 2 -->
    <rect x="155" y="340" width="6" height="45" fill="#92400e" rx="2"/>
    <ellipse cx="158" cy="322" rx="22" ry="26" fill="#15803d"/>
    <ellipse cx="158" cy="329" rx="17" ry="20" fill="#16a34a"/>
    <!-- Tree 3 (right) -->
    <rect x="1090" y="335" width="8" height="50" fill="#92400e" rx="3"/>
    <ellipse cx="1094" cy="315" rx="26" ry="30" fill="#16a34a"/>
    <ellipse cx="1094" cy="323" rx="20" ry="23" fill="#4ade80"/>
  </g>

  <!-- Flower decorations on ground -->
  <g opacity="0.9">
    <circle cx="220" cy="390" r="5" fill="#fbbf24"/>
    <circle cx="225" cy="387" r="3.5" fill="#fb923c"/>
    <circle cx="215" cy="387" r="3.5" fill="#f97316"/>
    <circle cx="340" cy="391" r="5" fill="#fde68a"/>
    <circle cx="345" cy="388" r="3.5" fill="#fbbf24"/>
    <circle cx="335" cy="388" r="3.5" fill="#fb923c"/>
  </g>

  <!-- RUNNER 1 — Lead runner (front, energetic, center-right) -->
  <g transform="translate(720, 390)" filter="url(#softShadow)">
    <!-- Shadow -->
    <ellipse cx="0" cy="4" rx="26" ry="7" fill="rgba(120,53,15,0.2)"/>
    <!-- Jersey (orange) -->
    <line x1="-2" y1="-118" x2="-6" y2="-65" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="3" cy="-134" r="15" fill="#fcd9b0"/>
    <!-- Hair -->
    <path d="M-10,-140 Q3,-155 18,-140 Q18,-128 3,-128 Q-10,-128 -10,-140Z" fill="#7c2d12"/>
    <!-- Eyes & Mouth (determined expression) -->
    <circle cx="-1" cy="-135" r="2" fill="#3b1f00"/>
    <circle cx="8" cy="-135" r="2" fill="#3b1f00"/>
    <path d="M0,-130 Q3.5,-127 7,-130" stroke="#c2410c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Torso -->
    <line x1="-2" y1="-118" x2="-4" y2="-68" stroke="#ea580c" stroke-width="9" stroke-linecap="round"/>
    <!-- Number bib -->
    <rect x="-8" y="-105" width="18" height="20" rx="3" fill="white" opacity="0.9"/>
    <text x="-4" y="-90" font-family="Arial" font-size="11" fill="#ea580c" font-weight="900">1</text>
    <!-- Right arm (back, pumping back) -->
    <line x1="-3" y1="-108" x2="-30" y2="-80" stroke="#fcd9b0" stroke-width="5" stroke-linecap="round"/>
    <line x1="-30" y1="-80" x2="-16" y2="-58" stroke="#fcd9b0" stroke-width="5" stroke-linecap="round"/>
    <!-- Left arm (forward, pumping forward) -->
    <line x1="-3" y1="-108" x2="24" y2="-83" stroke="#fcd9b0" stroke-width="5" stroke-linecap="round"/>
    <line x1="24" y1="-83" x2="14" y2="-60" stroke="#fcd9b0" stroke-width="5" stroke-linecap="round"/>
    <!-- Shorts -->
    <line x1="-4" y1="-68" x2="-4" y2="-55" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round"/>
    <!-- Left leg (push-off, back) -->
    <line x1="-4" y1="-55" x2="18" y2="-25" stroke="#1d4ed8" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="18" y1="-25" x2="22" y2="0"   stroke="#f97316" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Right leg (stride forward, lifted) -->
    <line x1="-4" y1="-55" x2="-30" y2="-25" stroke="#1d4ed8" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="-30" y1="-25" x2="-15" y2="0"  stroke="#f97316" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="22"  cy="3" rx="12" ry="5" fill="#1d4ed8"/>
    <ellipse cx="-15" cy="3" rx="12" ry="5" fill="#1d4ed8"/>
    <!-- Laces -->
    <line x1="16" y1="1" x2="28" y2="1" stroke="white" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- RUNNER 2 — Second place, left, green jersey -->
  <g transform="translate(490, 393)" opacity="0.9">
    <ellipse cx="0" cy="4" rx="21" ry="6" fill="rgba(120,53,15,0.15)"/>
    <!-- Head -->
    <circle cx="3" cy="-110" r="13" fill="#fde9c9"/>
    <!-- Torso -->
    <line x1="-1" y1="-97" x2="-3" y2="-58" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="-2" y1="-87" x2="-24" y2="-64" stroke="#fde9c9" stroke-width="4" stroke-linecap="round"/>
    <line x1="-24" y1="-64" x2="-12" y2="-46" stroke="#fde9c9" stroke-width="4" stroke-linecap="round"/>
    <line x1="-2" y1="-87" x2="20" y2="-66" stroke="#fde9c9" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="-66" x2="10" y2="-50" stroke="#fde9c9" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-3" y1="-58" x2="14" y2="-28" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <line x1="14" y1="-28" x2="17" y2="0"   stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <line x1="-3" y1="-58" x2="-22" y2="-28" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <line x1="-22" y1="-28" x2="-12" y2="0"  stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="17"  cy="3" rx="10" ry="4" fill="#16a34a"/>
    <ellipse cx="-12" cy="3" rx="10" ry="4" fill="#16a34a"/>
  </g>

  <!-- RUNNER 3 — Third, further back, purple jersey -->
  <g transform="translate(310, 394)" opacity="0.75">
    <ellipse cx="0" cy="4" rx="16" ry="5" fill="rgba(120,53,15,0.1)"/>
    <circle cx="2" cy="-88" r="10" fill="#fde9c9"/>
    <line x1="0" y1="-78" x2="-2" y2="-46" stroke="#9333ea" stroke-width="6" stroke-linecap="round"/>
    <line x1="-1" y1="-68" x2="-18" y2="-50" stroke="#fde9c9" stroke-width="3" stroke-linecap="round"/>
    <line x1="-18" y1="-50" x2="-9" y2="-36" stroke="#fde9c9" stroke-width="3" stroke-linecap="round"/>
    <line x1="-1" y1="-68" x2="16" y2="-52" stroke="#fde9c9" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="-52" x2="8" y2="-38" stroke="#fde9c9" stroke-width="3" stroke-linecap="round"/>
    <line x1="-2" y1="-46" x2="12" y2="-20" stroke="#7e22ce" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="-20" x2="14" y2="0"   stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <line x1="-2" y1="-46" x2="-18" y2="-20" stroke="#7e22ce" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="-20" x2="-10" y2="0"  stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="14"  cy="3" rx="8" ry="3" fill="#9333ea"/>
    <ellipse cx="-10" cy="3" rx="8" ry="3" fill="#9333ea"/>
  </g>

  <!-- RUNNER 4 — Far left, small, blue jersey -->
  <g transform="translate(155" opacity="0.55">
    <g transform="translate(0, 394)">
      <circle cx="2" cy="-72" r="8" fill="#fde9c9"/>
      <line x1="0" y1="-63" x2="-2" y2="-38" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
      <line x1="-1" y1="-54" x2="-14" y2="-40" stroke="#fde9c9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-1" y1="-54" x2="12" y2="-42" stroke="#fde9c9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-2" y1="-38" x2="10" y2="-18" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="10" y1="-18" x2="12" y2="0"   stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-2" y1="-38" x2="-14" y2="-18" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-14" y1="-18" x2="-8" y2="0"  stroke="#fb923c" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="12"  cy="3" rx="7" ry="3" fill="#3b82f6"/>
      <ellipse cx="-8"  cy="3" rx="7" ry="3" fill="#3b82f6"/>
    </g>
  </g>

  <!-- Speed/motion lines for lead runner -->
  <g opacity="0.5">
    <line x1="640" y1="305" x2="690" y2="300" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="635" y1="320" x2="685" y2="316" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="640" y1="335" x2="682" y2="333" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="645" y1="350" x2="678" y2="349" stroke="#fbbf24" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Finish line (right side) -->
  <g transform="translate(1060, 390)">
    <rect x="0" y="-70" width="7" height="75" fill="#f97316" rx="3"/>
    <!-- Checkered flag -->
    <rect x="7" y="-70" width="68" height="40" rx="3" fill="white" stroke="#fed7aa" stroke-width="1"/>
    <rect x="7"  y="-70" width="17" height="13" fill="#1f2937"/>
    <rect x="41" y="-70" width="17" height="13" fill="#1f2937"/>
    <rect x="24" y="-57" width="17" height="13" fill="#1f2937"/>
    <rect x="58" y="-57" width="17" height="13" fill="#1f2937"/>
    <rect x="7"  y="-44" width="17" height="13" fill="#1f2937"/>
    <rect x="41" y="-44" width="17" height="13" fill="#1f2937"/>
    <!-- Flag pole tip -->
    <circle cx="0" cy="-72" r="4" fill="#fbbf24"/>
  </g>

  <!-- Balloons (decorative) -->
  <g>
    <!-- Balloon 1 -->
    <ellipse cx="1000" cy="190" rx="18" ry="22" fill="#f97316" opacity="0.85"/>
    <line x1="1000" y1="212" x2="998" y2="240" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
    <!-- Balloon 2 -->
    <ellipse cx="1025" cy="175" rx="15" ry="19" fill="#fbbf24" opacity="0.85"/>
    <line x1="1025" y1="194" x2="1023" y2="225" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
    <!-- Balloon 3 -->
    <ellipse cx="1048" cy="185" rx="14" ry="18" fill="#f43f5e" opacity="0.8"/>
    <line x1="1048" y1="203" x2="1046" y2="232" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Branding text panel (left side, over sky) -->
  <g>
    <!-- Semi-transparent panel -->
    <rect x="40" y="160" width="380" height="180" rx="20" fill="white" opacity="0.45"/>
    <text x="60" y="205" font-family="Arial Black, Arial" font-size="34" font-weight="900" fill="#7c2d12" letter-spacing="-0.5px">KOMUNITAS</text>
    <text x="60" y="248" font-family="Arial Black, Arial" font-size="34" font-weight="900" fill="#ea580c" letter-spacing="-0.5px">PELARI KALCER</text>
    <text x="62" y="274" font-family="Arial" font-size="15" fill="#b45309" letter-spacing="2px">☀ RUN · CONNECT · GROW</text>
    <!-- Stats row -->
    <rect x="60"  y="290" width="100" height="40" rx="10" fill="white" opacity="0.75"/>
    <text x="110" y="308" font-family="Arial" font-size="17" font-weight="900" fill="#ea580c" text-anchor="middle">500+</text>
    <text x="110" y="323" font-family="Arial" font-size="10" fill="#b45309" text-anchor="middle">Anggota</text>

    <rect x="172" y="290" width="100" height="40" rx="10" fill="white" opacity="0.75"/>
    <text x="222" y="308" font-family="Arial" font-size="17" font-weight="900" fill="#ea580c" text-anchor="middle">50+</text>
    <text x="222" y="323" font-family="Arial" font-size="10" fill="#b45309" text-anchor="middle">Event/Tahun</text>

    <rect x="284" y="290" width="100" height="40" rx="10" fill="white" opacity="0.75"/>
    <text x="334" y="308" font-family="Arial" font-size="17" font-weight="900" fill="#ea580c" text-anchor="middle">4 Kota</text>
    <text x="334" y="323" font-family="Arial" font-size="10" fill="#b45309" text-anchor="middle">Jangkauan</text>
  </g>

  <!-- Distance markers on track -->
  <g font-family="Arial" font-size="12" font-weight="bold" fill="white" opacity="0.7">
    <text x="200" y="455">5K</text>
    <text x="430" y="455">10K</text>
    <text x="640" y="455">21K</text>
    <text x="850" y="455">42K</text>
    <text x="1050" y="455">FINISH 🏁</text>
  </g>
</svg>
